# Plantilla HTTPS. enable-https.sh reemplaza __DOMAIN__ por el dominio real.

# Cualquier acceso por HTTP (incluida la IP pública) se redirige al dominio con HTTPS.
# OWASP ZAP 10036/20020: no anunciar la versión de Nginx en la cabecera Server.
server_tokens off;

# Caché local de los estáticos que Django lee del bucket S3 privado.
proxy_cache_path /var/cache/nginx/petcare-static levels=1:2 keys_zone=petcare_static:10m max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Compresión de texto y caché larga para estáticos versionados.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    client_max_body_size 12m;  # Adjuntos clínicos de hasta 10 MB.

    # Los estáticos viven en S3 (bucket privado). Django los lee con el rol IAM de la EC2
    # y Nginx guarda una copia: el bucket nunca queda público.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache petcare_static;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
