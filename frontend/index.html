<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetCare · Veterinaria San Francisco</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<section id="login-view" class="login" hidden>
    <div class="login-side">
        <img class="logo" src="assets/logo.webp" alt="Veterinaria San Francisco" width="480" height="240">
        <h1>Cada visita deja una huella en su ficha</h1>
        <p>Aplicación web del equipo clínico. Se conecta a la API REST de PetCare a través de Amazon API Gateway con autenticación JWT.</p>
    </div>
    <form id="login-form" class="card login-card" autocomplete="on">
        <h2>Ingresar</h2>
        <p class="muted">Usa tu cuenta del equipo de la clínica.</p>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="alert error" role="alert" hidden></p>
        <button type="submit">Ingresar</button>
    </form>
</section>

<div id="app-view" class="layout" hidden>
    <aside class="sidebar">
        <img class="logo" src="assets/logo.webp" alt="Veterinaria San Francisco" width="480" height="240">
        <nav id="nav" aria-label="Secciones"></nav>
        <div class="account">
            <strong id="who"></strong>
            <small id="role"></small>
            <button id="logout" class="ghost" type="button">Cerrar sesión</button>
        </div>
    </aside>
    <main id="main" class="content" tabindex="-1">
        <div id="flash" class="alert" role="status" hidden></div>
        <div id="view"></div>
        <details class="api-log">
            <summary>Últimas solicitudes a la API</summary>
            <ol id="api-log"></ol>
        </details>
    </main>
</div>
</body>
</html>
