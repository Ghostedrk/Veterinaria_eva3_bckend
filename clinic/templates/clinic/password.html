{% extends "clinic/base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<section class="panel form-panel">

        {% csrf_token %}
        {{ form.as_p }}

        <a href="{% url 'dashboard' %}">Volver</a>
    </form>
</section>
{% endblock %}
